<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>経費申請</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --green:#06C755; --ink:#1e2225; --sub:#5a656d; --line:#e3e7ea;
  --bg:#ffffff; --soft:#f5f6f8; --red:#d93025; --sun:#e05a4e; --sat:#3b7dd8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
     color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5;
     display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit}
#root{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}

/* ===== ヘッダー ===== */
.hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
.hd .ttl{font-size:18px;font-weight:700}
.hd .nm{font-size:13px;color:var(--sub)}
.pbtn{min-height:38px;padding:6px 12px;border:1px solid var(--line);border-radius:9px;
      background:#fff;font-size:14px;color:var(--sub)}
.pbtn:active{background:var(--soft)}

/* ===== カレンダー ===== */
.cal{flex:1 1 auto;overflow-y:auto;padding:8px 8px 4px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.wk div{text-align:center;font-size:12px;color:var(--sub);padding:4px 0}
.wk div:first-child{color:var(--sun)} .wk div:last-child{color:var(--sat)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cell{aspect-ratio:1/1.15;border:1px solid transparent;border-radius:10px;background:var(--soft);
      display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
      padding:5px 2px 2px;position:relative;min-height:52px}
.cell.blank{background:transparent}
.cell.out{background:#fafbfc;color:#c3c9cd}
.cell:not(.blank):not(.out):active{background:#e8eaed}
.cell .d{font-size:15px;font-weight:600;line-height:1.1}
.cell.sun .d{color:var(--sun)} .cell.sat .d{color:var(--sat)}
.cell.today{border-color:var(--green)}
.cell.today .d{color:var(--green)}
.cell .amt{font-size:10px;color:var(--sub);margin-top:auto;line-height:1.2;
           white-space:nowrap;overflow:hidden;max-width:100%}
.cell .cnt{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.cell.future{opacity:.45}

/* ===== 合計バー ===== */
.sum{flex:0 0 auto;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
     display:flex;align-items:baseline;justify-content:space-between;background:#fff}
.sum .lbl{font-size:13px;color:var(--sub)}
.sum .v{font-size:24px;font-weight:700}
.sum .cn{font-size:13px;color:var(--sub);margin-left:6px}

/* ===== シート（ポップアップ） ===== */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;
      transition:opacity .18s;z-index:20}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;z-index:21;
       border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .22s;
       max-height:92vh;display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sheet .bar{padding:12px 16px 8px;border-bottom:1px solid var(--line);flex:0 0 auto;
            display:flex;align-items:center;justify-content:space-between}
.sheet .bar h3{margin:0;font-size:17px}
.sheet .body{overflow-y:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom));flex:1 1 auto}
.x{min-width:44px;min-height:38px;border:none;background:none;color:var(--sub);font-size:20px}
.back{min-height:38px;padding:4px 10px;border:none;background:none;color:var(--sub);font-size:15px}

/* ===== 明細行 ===== */
.item{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);
      min-height:56px}
.item:active{background:var(--soft)}
.item .ic{width:34px;height:34px;border-radius:9px;background:var(--soft);flex:0 0 auto;
          display:flex;align-items:center;justify-content:center;font-size:16px}
.item .tx{flex:1 1 auto;min-width:0}
.item .t1{font-size:15px;font-weight:600}
.item .t2{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .yen{font-size:16px;font-weight:700;flex:0 0 auto}
.item .ar{color:#c9ced2;flex:0 0 auto}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:22px 0}

/* ===== 入力パーツ ===== */
.add{width:100%;min-height:52px;border:1px dashed var(--green);border-radius:12px;background:#f2fbf5;
     color:var(--green);font-weight:700;font-size:16px;margin-top:14px}
.add:active{background:#e4f7ea}
.big{width:100%;min-height:58px;border:1px solid var(--line);border-radius:12px;background:#fff;
     display:flex;align-items:center;gap:12px;padding:0 14px;margin-bottom:8px;text-align:left;font-size:16px}
.big:active{background:var(--soft)}
.big .e{font-size:22px}
.big .s{display:block;font-size:12px;color:var(--sub);font-weight:400}
label.fl{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
input[type=text],input[type=number]{width:100%;padding:13px;font-size:17px;border:1px solid var(--line);
  border-radius:11px;background:#fff;color:var(--ink);font-family:inherit}
select{width:100%;padding:13px;font-size:17px;border:1px solid var(--line);border-radius:11px;
  background:#fff;color:var(--ink);font-family:inherit;-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%235a656d' stroke-width='2' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 14px;min-height:42px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:15px}
.chip.on{border-color:var(--green);background:#eafaf1;color:#04913f;font-weight:700}
.save{width:100%;min-height:54px;border:none;border-radius:12px;background:var(--green);color:#fff;
      font-weight:700;font-size:17px;margin-top:18px}
.save:disabled{background:#b8e6c9}
.del{width:100%;min-height:48px;border:1px solid #f0c3bf;border-radius:12px;background:#fff;
     color:var(--red);font-size:15px;margin-top:10px}
.calc{background:var(--soft);border-radius:11px;padding:11px 14px;margin-top:12px;font-size:14px}
.calc b{font-size:22px}
.msg{font-size:14px;margin:10px 0;min-height:1.1em}
.msg.err{color:var(--red)} .msg.ok{color:var(--green)}
.note{font-size:12px;color:var(--sub);margin:8px 0 0}
.prev{width:100%;border-radius:11px;border:1px solid var(--line);margin:10px 0;display:block}
.hide{display:none}
.center{text-align:center;padding:60px 20px;color:var(--sub)}
.spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--green);
      border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="root"><div class="center"><div class="spin"></div>読み込んでいます…</div></div>

<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="bar" id="sheetBar"></div>
  <div class="body" id="sheetBody"></div>
</div>

<script>
/* =========================================================
   設定
   ========================================================= */
var LIFF_ID     = '2011524519-lSwDjFOP';
var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwYguEyJP2VaZ3xixjiCUIHy2a_qAW_umaaQ4UAGgsT9N0jLo7gajy-y2s4qV7d0zBz/exec';
/* ========================================================= */

var S = {
  idToken:'', emp:null, cfg:null,
  period:'', periodLabel:'', dates:[], today:'',
  items:[],                 // 期間内の明細
  day:'',                   // 開いている日
  draft:null,               // 編集中の1件
  lastClinic:''
};

/* ---------- 通信 ---------- */
function api(fn, args){
  return fetch(GAS_API_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({fn:fn, args:args||{}})
  }).then(function(r){ return r.json(); });
}

/* ---------- 小道具 ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function yen(n){ return Number(n||0).toLocaleString('ja-JP'); }
function md(iso){ var p=iso.split('-'); return Number(p[1])+'/'+Number(p[2]); }
// 端末のタイムゾーンに影響されないよう、日付文字列から直接曜日を求める
function dow(iso){
  var p=iso.split('-');
  return new Date(Date.UTC(Number(p[0]), Number(p[1])-1, Number(p[2]))).getUTCDay();
}
function wdName(iso){ return '日月火水木金土'[dow(iso)]; }
function icon(cat){
  return cat==='ガソリン'?'⛽':cat==='高速代'?'🛣':cat==='駐車場代'?'🅿️':'🧾';
}
function itemsOf(d){ return S.items.filter(function(x){ return x.date===d; }); }
function sumOf(list){ var t=0; list.forEach(function(x){ t+=Number(x.amount)||0; }); return t; }

/* =========================================================
   カレンダー
   ========================================================= */
function renderCal(){
  var h = '<div class="hd">'+
    '<div><div class="ttl">'+esc(S.periodLabel)+'</div>'+
    '<div class="nm">'+esc(S.emp.name)+' さんの経費</div></div>'+
    '<button class="pbtn" onclick="openPrev()">前の期間</button>'+
  '</div>';

  h += '<div class="cal"><div class="wk">'+
       '<div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>'+
       '</div><div class="grid">';

  // 先頭の空白（週の始まりに合わせる）
  var lead = dow(S.dates[0]);
  for (var b=0;b<lead;b++) h += '<div class="cell blank"></div>';

  S.dates.forEach(function(d){
    var list = itemsOf(d), t = sumOf(list);
    var cls = 'cell';
    if (dow(d)===0) cls+=' sun';
    if (dow(d)===6) cls+=' sat';
    if (d===S.today) cls+=' today';
    if (d > S.today) cls+=' future';
    h += '<button class="'+cls+'" onclick="openDay(\'' + d + '\')">'+
         (list.length?'<span class="cnt"></span>':'')+
         '<span class="d">'+Number(d.split('-')[2])+'</span>'+
         (t?'<span class="amt">'+yen(t)+'</span>':'')+
         '</button>';
  });
  h += '</div></div>';

  var total = sumOf(S.items);
  h += '<div class="sum"><span class="lbl">'+esc(S.periodLabel)+' の合計</span>'+
       '<span><span class="v">'+yen(total)+'</span>円'+
       '<span class="cn">'+S.items.length+'件</span></span></div>';

  document.getElementById('root').innerHTML = h;
}

/* =========================================================
   シート制御
   ========================================================= */
function openSheet(){ document.getElementById('mask').classList.add('on');
                      document.getElementById('sheet').classList.add('on'); }
function closeSheet(){ document.getElementById('mask').classList.remove('on');
                       document.getElementById('sheet').classList.remove('on'); S.draft=null; }
function setSheet(barHtml, bodyHtml){
  document.getElementById('sheetBar').innerHTML = barHtml;
  document.getElementById('sheetBody').innerHTML = bodyHtml;
  document.getElementById('sheetBody').scrollTop = 0;
}

/* --- 日別一覧 --- */
function openDay(d){
  S.day = d;
  showDay();
  openSheet();
}
function showDay(){
  var d = S.day, list = itemsOf(d);
  var bar = '<h3>'+md(d)+'（'+wdName(d)+'）</h3><button class="x" onclick="closeSheet()">✕</button>';

  var b = '';
  if (!list.length) {
    b += '<div class="empty">まだ登録がありません</div>';
  } else {
    list.forEach(function(x){
      var sub = x.category==='ガソリン'
        ? (x.from||'') + (x.to?' → '+x.to:'') + (x.km?'　'+x.km+'km':'')
        : (x.clinic||'') + (x.memo?'　'+x.memo:'');
      b += '<div class="item" onclick="editItem(\'' + x.id + '\')">'+
           '<div class="ic">'+icon(x.category)+'</div>'+
           '<div class="tx"><div class="t1">'+esc(x.category)+'</div>'+
           '<div class="t2">'+esc(sub)+'</div></div>'+
           '<div class="yen">'+yen(x.amount)+'</div><div class="ar">›</div></div>';
    });
    b += '<div class="calc" style="margin-top:14px">この日の合計 <b>'+yen(sumOf(list))+'</b> 円</div>';
  }

  if (d > S.today) {
    b += '<p class="note">未来の日付には登録できません。</p>';
  } else {
    b += '<button class="add" onclick="chooseType()">＋ 経費を追加</button>';
  }
  setSheet(bar, b);
}

/* --- 追加方法の選択 --- */
function chooseType(){
  var bar = '<button class="back" onclick="showDay()">‹ 戻る</button>'+
            '<h3>'+md(S.day)+' に追加</h3><button class="x" onclick="closeSheet()">✕</button>';
  var b =
    '<button class="big" onclick="startPhoto()"><span class="e">📷</span>'+
      '<span>領収書を撮る<span class="s">写真から金額と種類を自動で読み取ります</span></span></button>'+
    '<button class="big" onclick="startGas()"><span class="e">⛽</span>'+
      '<span>ガソリン代<span class="s">走行距離から自動計算・写真不要</span></span></button>'+
    '<button class="big" onclick="startManual()"><span class="e">✏️</span>'+
      '<span>手入力<span class="s">領収書がない経費はこちら</span></span></button>';
  setSheet(bar, b);
}

/* --- 写真から --- */
function startPhoto(){
  var bar = '<button class="back" onclick="chooseType()">‹ 戻る</button>'+
            '<h3>領収書を撮る</h3><button class="x" onclick="closeSheet()">✕</button>';
  var b = '<input type="file" id="file" accept="image/*" capture="environment" class="hide" onchange="onPick(event)">'+
    '<button class="big" style="justify-content:center;border-color:var(--green);color:var(--green);font-weight:700"'+
      ' onclick="document.getElementById(\'file\').click()">📷 カメラを開く / 写真を選ぶ</button>'+
    '<div id="prevBox"></div><div class="msg" id="aiMsg" aria-live="polite"></div>'+
    '<p class="note">1枚ずつ撮ってください。うまく読めなくても、次の画面で手入力できます。</p>';
  setSheet(bar, b);
}

function onPick(ev){
  var f = ev.target.files && ev.target.files[0];
  if (!f) return;
  var msg = document.getElementById('aiMsg');
  msg.className='msg'; msg.textContent='画像を準備しています…';

  toJpegBase64(f).then(function(b64){
    document.getElementById('prevBox').innerHTML =
      '<img class="prev" src="data:image/jpeg;base64,'+b64+'" alt="撮影した領収書">';
    msg.textContent='AIが読み取っています…（10秒ほどかかります）';
    return api('apiReadReceipt',{idToken:S.idToken, imageBase64:b64}).then(function(r){
      var ai = (r && r.ok && r.ai) ? r.ai : null;
      newDraft({
        category: (ai && ai.kind) ? ai.kind : '高速代',
        amount:   (ai && ai.amount) ? ai.amount : '',
        memo:     (ai && ai.store) ? ai.store : '',
        image:    b64,
        aiAmount: (ai && ai.amount) ? ai.amount : ''
      });
      showForm(ai ? (ai.amount ? '読み取りました。内容をご確認ください。'
                               : '金額が読み取れませんでした。入力してください。')
                  : ((r && r.note) ? r.note : '自動読み取りができませんでした。'));
    });
  }).catch(function(e){
    msg.className='msg err';
    msg.textContent='画像を処理できませんでした（'+(e && e.message ? e.message : e)+'）。'+
                    '「手入力」から登録してください。';
  });
}

/** 画像をJPEGのbase64に変換する。失敗時は元ファイルをそのまま使う */
function toJpegBase64(file){
  return shrink(file, 1400, 0.75).catch(function(){ return rawBase64(file); })
    .then(function(b64){
      if (b64.length > 4000000) throw new Error('画像サイズが大きすぎます');
      return b64;
    });
}
function shrink(file, max, q){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    var done = false;
    var t = setTimeout(function(){ if(!done){ done=true; URL.revokeObjectURL(url); rej(new Error('タイムアウト')); } }, 12000);
    img.onload = function(){
      if (done) return; done = true; clearTimeout(t);
      try{
        var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        var s=Math.min(1, max/Math.max(w,h));
        var cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(w*s)); cv.height=Math.max(1,Math.round(h*s));
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        var out = cv.toDataURL('image/jpeg', q).split(',')[1];
        URL.revokeObjectURL(url);
        if (!out || out.length < 100) rej(new Error('変換に失敗')); else res(out);
      }catch(err){ URL.revokeObjectURL(url); rej(err); }
    };
    img.onerror = function(){ if(done) return; done=true; clearTimeout(t);
      URL.revokeObjectURL(url); rej(new Error('画像を開けません')); };
    img.src = url;
  });
}
function rawBase64(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ var s=String(fr.result); var i=s.indexOf(',');
      i>=0 ? res(s.slice(i+1)) : rej(new Error('読み込み失敗')); };
    fr.onerror = function(){ rej(new Error('読み込み失敗')); };
    fr.readAsDataURL(file);
  });
}

/* --- ガソリン・手入力 --- */
function startGas(){ newDraft({category:'ガソリン', trip:'業務'}); showForm(''); }
function startManual(){ newDraft({category:'その他'}); showForm(''); }

function newDraft(o){
  S.draft = {
    id:'', date:S.day, clinic:(S.lastClinic || (S.emp.clinic||'')),
    category:o.category||'', amount:o.amount||'', km:'', from:'', to:'',
    trip:o.trip||'', memo:o.memo||'', image:o.image||'', aiAmount:o.aiAmount||''
  };
}

/* --- 既存明細の編集 --- */
function editItem(id){
  var x = null;
  S.items.forEach(function(i){ if(i.id===id) x=i; });
  if (!x) return;
  S.draft = { id:x.id, date:x.date, clinic:x.clinic, category:x.category,
              amount:x.amount, km:x.km, from:x.from, to:x.to, trip:x.trip,
              memo:x.memo, image:'', aiAmount:'' };
  showForm('');
}

/* --- 入力フォーム（1画面） --- */
function showForm(hint){
  var d = S.draft, isGas = d.category==='ガソリン', edit = !!d.id;
  var bar = '<button class="back" onclick="'+(edit?'showDay()':'chooseType()')+'">‹ 戻る</button>'+
            '<h3>'+md(d.date)+'（'+wdName(d.date)+'）'+(edit?' の修正':'')+'</h3>'+
            '<button class="x" onclick="closeSheet()">✕</button>';

  var b = '';
  if (hint) b += '<div class="msg '+(d.amount?'ok':'')+'">'+esc(hint)+'</div>';
  if (d.image) b += '<img class="prev" src="data:image/jpeg;base64,'+d.image+'" alt="領収書">';

  // 種類
  b += '<label class="fl">種類</label><div class="chips">';
  var cats = S.cfg.categories.slice();
  if (cats.indexOf('ガソリン') < 0) cats.unshift('ガソリン');
  cats.forEach(function(c){
    b += '<button class="chip '+(d.category===c?'on':'')+'" onclick="setCat(\'' + c + '\')">'+esc(c)+'</button>';
  });
  b += '</div>';

  // 院
  b += '<label class="fl">所属院</label><select id="fClinic">';
  S.cfg.clinics.forEach(function(c){
    b += '<option value="'+esc(c)+'" '+(d.clinic===c?'selected':'')+'>'+esc(c)+'</option>';
  });
  b += '</select>';

  if (isGas) {
    b += '<label class="fl">移動区分</label><div class="chips">'+
      '<button class="chip '+(d.trip==='業務'?'on':'')+'" onclick="setTrip(\'業務\')">業務</button>'+
      '<button class="chip '+(d.trip==='通勤'?'on':'')+'" onclick="setTrip(\'通勤\')">通勤</button>'+
      '</div>';
    b += '<label class="fl">出発地 → 到着地</label>'+
      '<div style="display:flex;gap:8px">'+
      '<input type="text" id="fFrom" value="'+esc(d.from)+'" placeholder="自宅">'+
      '<input type="text" id="fTo" value="'+esc(d.to)+'" placeholder="東生駒院"></div>';
    b += '<label class="fl">走行距離（km）</label>'+
      '<input type="number" id="fKm" inputmode="decimal" step="0.1" min="0" value="'+esc(d.km)+'" oninput="calcGas()">'+
      '<div class="calc">金額 <b id="gasAmt">—</b> 円'+
      '<span class="note" style="margin-left:8px">1kmあたり '+S.cfg.gasRate+'円</span></div>';
  } else {
    b += '<label class="fl">金額（税込・円）</label>'+
      '<input type="number" id="fAmt" inputmode="numeric" min="1" value="'+esc(d.amount)+'" placeholder="1204">';
  }

  b += '<label class="fl">メモ（任意）</label>'+
    '<input type="text" id="fMemo" value="'+esc(d.memo)+'" placeholder="店名・内容など">';

  b += '<div class="msg err" id="fMsg" aria-live="polite"></div>';
  b += '<button class="save" id="saveBtn" onclick="saveDraft(false)">'+(edit?'この内容に修正する':'保存する')+'</button>';
  b += '<div id="dupBox"></div>';
  if (edit) b += '<button class="del" onclick="delItem()">この経費を削除する</button>';

  setSheet(bar, b);
  if (isGas) calcGas();
}

function pullForm(){
  var d = S.draft;
  var g = function(id){ var e=document.getElementById(id); return e?e.value:''; };
  d.clinic = g('fClinic') || d.clinic;
  d.memo   = g('fMemo');
  if (d.category==='ガソリン') { d.km = g('fKm'); d.amount=''; }
  else { d.amount = g('fAmt'); d.km=''; }
}
function setCat(c){ pullForm(); S.draft.category=c; showForm(''); }
function setTrip(t){ pullForm(); S.draft.trip=t; showForm(''); }
function calcGas(){
  var v = parseFloat(document.getElementById('fKm').value);
  var ok = v>0 && v<=2000;
  document.getElementById('gasAmt').textContent = ok ? yen(Math.round(v*S.cfg.gasRate)) : '—';
}

function saveDraft(confirmed){
  pullForm();
  var d = S.draft, m = document.getElementById('fMsg'), btn = document.getElementById('saveBtn');
  m.textContent='';

  if (!d.category){ m.textContent='種類を選んでください。'; return; }
  if (d.category==='ガソリン'){
    if (!(parseFloat(d.km)>0)){ m.textContent='走行距離を入力してください。'; return; }
    if (!d.trip){ m.textContent='移動区分を選んでください。'; return; }
  } else {
    if (!(parseInt(d.amount,10)>0)){ m.textContent='金額を入力してください。'; return; }
  }

  btn.disabled = true; btn.textContent = '保存しています…';
  var payload = { date:d.date, clinic:d.clinic, category:d.category, amount:d.amount,
                  km:d.km, from:d.from||document.getElementById('fFrom')&&document.getElementById('fFrom').value||'',
                  to:d.to||document.getElementById('fTo')&&document.getElementById('fTo').value||'',
                  trip:d.trip, memo:d.memo, imageBase64:d.image,
                  aiAmount:d.aiAmount, confirmed:!!confirmed };

  var call = d.id ? api('apiUpdate',{idToken:S.idToken, id:d.id, payload:payload})
                  : api('apiSubmit',{idToken:S.idToken, payload:payload});

  call.then(function(r){
    if (r.ok){
      S.lastClinic = d.clinic;
      if (r.items) { S.items = r.items; afterSave(); }
      else reload().then(afterSave);
      return;
    }
    btn.disabled=false; btn.textContent = d.id?'この内容に修正する':'保存する';
    m.textContent = r.error;
    if (r.duplicate){
      document.getElementById('dupBox').innerHTML =
        '<button class="del" onclick="saveDraft(true)">それでも登録する</button>';
    }
  }).catch(function(){
    btn.disabled=false; btn.textContent = d.id?'この内容に修正する':'保存する';
    m.textContent='通信に失敗しました。もう一度お試しください。';
  });
}
function afterSave(){ S.draft=null; renderCal(); showDay(); }

function delItem(){
  if (!confirm('この経費を削除しますか？')) return;
  api('apiDelete',{idToken:S.idToken, id:S.draft.id}).then(function(r){
    if (!r.ok){ document.getElementById('fMsg').textContent = r.error; return; }
    S.items = r.items || S.items;
    afterSave();
  });
}

/* --- 前の期間を見る --- */
function openPrev(){
  var p = S.period.split('-'), y=Number(p[0]), m=Number(p[1])-1;
  if (m<1){ m=12; y--; }
  var prev = y+'-'+('0'+m).slice(-2);
  api('apiGetMyList',{idToken:S.idToken, period:prev}).then(function(r){
    if (!r.ok){ alert(r.error); return; }
    var bar = '<h3>'+esc(r.periodLabel||prev)+' 分</h3><button class="x" onclick="closeSheet()">✕</button>';
    var b = '';
    if (!r.items.length) b += '<div class="empty">この期間の登録はありません</div>';
    else {
      r.items.forEach(function(x){
        b += '<div class="item"><div class="ic">'+icon(x.category)+'</div>'+
             '<div class="tx"><div class="t1">'+md(String(x.date).replace(/\//g,'-'))+'　'+esc(x.category)+'</div>'+
             '<div class="t2">'+esc(x.clinic||'')+'</div></div>'+
             '<div class="yen">'+yen(x.amount)+'</div></div>';
      });
      b += '<div class="calc" style="margin-top:14px">合計 <b>'+yen(r.total)+'</b> 円</div>';
    }
    b += '<p class="note">締め切り済みの期間は修正できません。</p>';
    setSheet(bar, b); openSheet();
  });
}

/* --- 再読み込み --- */
function reload(){
  return api('apiGetMyList',{idToken:S.idToken, period:S.period}).then(function(r){
    if (r.ok) S.items = r.items || [];
  });
}

/* =========================================================
   初回連携
   ========================================================= */
function renderLink(){
  document.getElementById('root').innerHTML =
    '<div class="hd"><div class="ttl">はじめに</div></div>'+
    '<div class="cal" style="padding:18px">'+
    '<p style="color:var(--sub);font-size:15px">最初の1回だけ、ご自身の従業員IDを入力してください。</p>'+
    '<label class="fl">従業員ID</label>'+
    '<input type="text" id="empId" inputmode="numeric" placeholder="例：100001">'+
    '<div class="msg err" id="linkMsg" aria-live="polite"></div>'+
    '<button class="save" onclick="doLink()">確認する</button></div>';
}
function doLink(){
  var v = document.getElementById('empId').value.trim();
  var m = document.getElementById('linkMsg');
  if (!v){ m.textContent='従業員IDを入力してください。'; return; }
  m.className='msg'; m.textContent='確認しています…';
  api('apiLink',{idToken:S.idToken, employeeId:v}).then(function(r){
    if (!r.ok){ m.className='msg err'; m.textContent=r.error; return; }
    S.emp = r.employee; S.lastClinic = r.employee.clinic || '';
    reload().then(renderCal);
  }).catch(function(){ m.className='msg err'; m.textContent='通信に失敗しました。'; });
}

/* =========================================================
   起動
   ========================================================= */
function boot(){
  liff.init({liffId:LIFF_ID}).then(function(){
    if (!liff.isLoggedIn()){ liff.login(); return; }
    S.idToken = liff.getIDToken();
    return api('apiGetProfile',{idToken:S.idToken});
  }).then(function(r){
    if (!r) return;
    if (!r.ok){ fail(r.error||'読み込みに失敗しました。'); return; }
    S.cfg=r.config; S.period=r.period; S.periodLabel=r.periodLabel;
    S.dates=r.dates; S.today=r.today; S.items=r.items||[];
    if (r.linked){ S.emp=r.employee; S.lastClinic=r.employee.clinic||''; renderCal(); }
    else renderLink();
  }).catch(function(){
    fail('初期化に失敗しました。LINEアプリから開き直してください。');
  });
}
function fail(msg){
  document.getElementById('root').innerHTML =
    '<div class="center"><p class="msg err">'+esc(msg)+'</p>'+
    '<button class="pbtn" onclick="location.reload()">読み込み直す</button></div>';
}
boot();
</script>
