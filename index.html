<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>経費申請</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --green:#06C755; --ink:#1e2225; --sub:#6b7378; --line:#e4e8ea;
  --bg:#ffffff; --soft:#f4f6f7; --red:#d93025; --sun:#e05a4e; --sat:#3b7dd8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
     color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5;
     display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit}
#root{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
svg.i{width:22px;height:22px;flex:0 0 auto;stroke:currentColor;fill:none;
      stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ヘッダー */
.hd{display:flex;align-items:center;gap:6px;padding:9px 10px;
    border-bottom:1px solid var(--line);flex:0 0 auto}
.hd .ttl{flex:1 1 auto;text-align:center}
.hd .ttl b{display:block;font-size:17px}
.hd .ttl span{font-size:11px;color:var(--sub)}
.nav{min-width:44px;min-height:44px;border:none;background:none;color:var(--sub);
     display:flex;align-items:center;justify-content:center}
.nav:disabled{opacity:.25}

/* カレンダー */
.cal{flex:1 1 auto;overflow-y:auto;padding:6px 7px 4px;touch-action:pan-y}
.stage{flex:1 1 auto;overflow:hidden;position:relative;touch-action:pan-y}
.track{display:flex;width:300%;height:100%;will-change:transform;
       backface-visibility:hidden;transform:translate3d(0,0,0)}
.page{width:33.3333%;flex:0 0 33.3333%;padding:6px 7px 4px;overflow-y:auto}
.wk{display:grid;grid-template-columns:repeat(7,1fr);padding:0 7px}
.wk div{text-align:center;font-size:11px;color:var(--sub);padding:3px 0}
.wk div:first-child{color:var(--sun)} .wk div:last-child{color:var(--sat)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cell{aspect-ratio:1/1.12;border:1.5px solid transparent;border-radius:10px;background:var(--soft);
      display:flex;flex-direction:column;align-items:center;padding:4px 2px 3px;
      position:relative;min-height:50px}
.cell.blank{background:transparent}
.cell:not(.blank):active{background:#e6e9eb}
.cell .d{font-size:15px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.cell.sun .d{color:var(--sun)} .cell.sat .d{color:var(--sat)}
.cell.today{border-color:var(--green)} .cell.today .d{color:var(--green)}
.cell .amt{font-size:10px;color:var(--sub);margin-top:auto;line-height:1.2;
           white-space:nowrap;overflow:hidden;max-width:100%;
           font-variant-numeric:tabular-nums;text-align:center}
.cell.future{opacity:.4}

/* 下部バー */
.foot{flex:0 0 auto;border-top:1px solid var(--line);background:#fff;
      padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.tot{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.tot .lbl{font-size:12px;color:var(--sub)}
.tot .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tot .cn{font-size:12px;color:var(--sub);margin-left:5px}
.shoot{width:100%;min-height:56px;border:none;border-radius:14px;background:var(--green);
       color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;
       justify-content:center;gap:9px;line-height:1}
.shoot:active{background:#05b34c}
.shoot svg.i{width:24px;height:24px;stroke-width:1.9}

/* シート */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;
      transition:opacity .18s;z-index:20}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;z-index:21;overflow:hidden;max-width:100%;
       border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .22s;
       max-height:92vh;display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sheet .bar{padding:11px 14px 9px;border-bottom:1px solid var(--line);flex:0 0 auto;
            display:flex;align-items:center;gap:8px}
.sheet .bar h3{margin:0;font-size:17px;flex:1 1 auto;line-height:1.3;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .bar .rt{font-size:16px;font-weight:700;flex:0 0 auto;
                font-variant-numeric:tabular-nums;line-height:1.3}
.sheet .body{overflow-y:auto;overflow-x:hidden;padding:12px 14px 14px;
            flex:1 1 auto;overscroll-behavior:contain;width:100%;min-height:0}
.sheet .foot2{flex:0 0 auto;border-top:1px solid var(--line);background:#fff;
             padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:none}
.x,.back{min-width:44px;min-height:40px;border:none;background:none;color:var(--sub);
         display:flex;align-items:center;justify-content:center}

/* 明細行 */
.item{display:flex;align-items:center;gap:10px;padding:12px 12px;border-bottom:1px solid var(--line);
      min-height:60px}
.item:active{background:var(--soft)}
.item .ic{width:36px;height:36px;border-radius:10px;background:var(--soft);flex:0 0 auto;
          display:flex;align-items:center;justify-content:center;color:var(--sub)}
.item .tx{flex:1 1 auto;min-width:0}
.item .t1{font-size:15px;font-weight:600;line-height:1.3}
.item .t2{font-size:12px;color:var(--sub);line-height:1.35;margin-top:1px;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .yen{font-size:16px;font-weight:700;flex:0 0 auto;font-variant-numeric:tabular-nums;
           line-height:1.2;white-space:nowrap}
.item .yen .cur{font-size:11px;font-weight:600;margin-left:2px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:20px 0}

/* 確認カード（撮影後） */
.card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;
      max-width:100%;overflow:hidden}
.card.done{border-color:var(--green);background:#f4fcf7}
.card.dup{border-color:#f0c3bf;background:#fdf6f5}
.card .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card .tx{flex:1 1 auto;min-width:0}
.card .cat{font-weight:700;font-size:16px;line-height:1.3;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{font-size:12px;color:var(--sub);line-height:1.35;margin:2px 0 0;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .amt2{font-size:20px;font-weight:700;flex:0 0 auto;line-height:1.2;
            font-variant-numeric:tabular-nums;white-space:nowrap}
.card .amt2 .cur{font-size:12px;font-weight:600;margin-left:2px;color:var(--sub)}
.card .row2{display:flex;gap:8px;align-items:stretch}
.card .ok{flex:1 1 auto;width:auto;min-height:46px;border:none;background:var(--green);
          color:#fff;font-weight:700;border-radius:11px}
.card .ok svg.i{width:19px;height:19px;stroke-width:2.1}
.card .ok:disabled{background:#e6eaec;color:#98a1a6}
.card .fix{width:auto;flex:0 0 auto;min-height:46px;padding:0 16px;border-radius:11px}
.card .fix.del2{padding:0 13px;color:var(--red);border-color:#f0c3bf}
.card .fix.del2 svg.i{width:19px;height:19px}
.card.done .ok{background:#d8f2e2;color:#04913f}
.alert{font-size:13px;line-height:1.45;color:var(--red);background:#fdf1f0;border-radius:9px;
       padding:8px 10px;margin-bottom:9px;word-break:break-word;overflow-wrap:anywhere}
.alert.warn{color:#9a6400;background:#fdf6e6}
.card .amt2.unsure{color:#9a6400}
.card .amt2 .q{font-size:15px;margin-left:2px}
.selall{font-size:15px;font-weight:600;margin-bottom:8px}
.selall.on{border-color:var(--green);background:#eafaf1;color:#04913f}
.selall svg.i{width:20px;height:20px;stroke-width:1.9}

/* スワイプで削除 */
.swipe{position:relative;overflow:hidden;background:var(--red)}
.swipe .trash{position:absolute;top:0;right:0;bottom:0;width:76px;border:none;background:var(--red);
              color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.swipe .trash svg.i{width:22px;height:22px;stroke-width:2}
.swipe .item{position:relative;background:#fff;will-change:transform}

.thumb{width:56px;height:56px;object-fit:cover;border-radius:9px;border:1px solid var(--line);flex:0 0 auto}
.prog{font-size:13px;color:var(--sub);text-align:center;padding:10px 0}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.shot{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .rm{position:absolute;top:3px;right:3px;width:26px;height:26px;border:none;border-radius:50%;
          background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.shot .rm svg.i{width:15px;height:15px;stroke-width:2.4}

/* ボタンの共通土台。アイコンと文字の縦位置ずれを構造的に防ぐ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
     line-height:1;font-family:inherit;font-size:16px;border-radius:12px;
     border:1px solid var(--line);background:#fff;color:var(--ink);
     min-height:48px;padding:0 14px;width:100%;text-align:center}
.btn svg.i{flex:0 0 auto}
.btn > span{display:inline-block;line-height:1}
.btn:disabled{opacity:1;color:#98a1a6}

/* 入力パーツ */
.add{min-height:50px;border:1px dashed var(--green);background:#f2fbf5;
     color:var(--green);font-weight:700;font-size:15px;margin-top:12px}
.big{width:100%;min-height:56px;border:1px solid var(--line);border-radius:12px;background:#fff;
     display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:8px;
     text-align:left;font-size:16px;line-height:1.35}
.big > span{flex:1 1 auto;min-width:0}
.big:active{background:var(--soft)}
.big .s{display:block;font-size:12px;color:var(--sub);font-weight:400;line-height:1.35;margin-top:2px}
label.fl{display:block;font-size:12px;color:var(--sub);margin:13px 0 5px}
input[type=text],input[type=number],input[type=date]{width:100%;padding:12px;font-size:17px;
  border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-family:inherit}
select{width:100%;padding:12px;font-size:17px;border:1px solid var(--line);border-radius:11px;
  background:#fff;color:var(--ink);font-family:inherit;-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236b7378' stroke-width='2' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 13px;min-height:40px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:15px}
.chip.on{border-color:var(--green);background:#eafaf1;color:#04913f;font-weight:700}
.rchip{width:100%;text-align:left;padding:11px 13px;min-height:48px;border:1px solid var(--line);
       border-radius:11px;background:#fff;margin-bottom:7px;font-size:15px}
.rchip span{color:var(--sub);font-size:13px}
.save{min-height:52px;border:none;background:var(--green);color:#fff;font-weight:700;font-size:17px}
.save:disabled{background:#c9e8d5;color:#fff}
.del{min-height:46px;border-color:#f0c3bf;color:var(--red);font-size:15px;margin-top:8px}
.del svg.i{width:19px;height:19px}
.line{border-color:var(--green);color:var(--green);font-weight:700;margin-bottom:8px}
.line2{margin-bottom:8px}
.calc{background:var(--soft);border-radius:11px;padding:10px 13px;margin-top:11px;font-size:14px}
.calc b{font-size:21px}
.msg{font-size:14px;margin:9px 0;min-height:1.1em;word-break:break-word;overflow-wrap:anywhere}
.msg.err{color:var(--red)} .msg.ok{color:var(--green)}
.note{font-size:12px;color:var(--sub);margin:8px 0 0}
.prev{width:100%;border-radius:11px;border:1px solid var(--line);margin:9px 0;display:block}
.hide{display:none}
.center{text-align:center;padding:60px 20px;color:var(--sub)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--green);
      border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));
       transform:translate(-50%,14px);background:rgba(30,34,37,.94);color:#fff;
       padding:11px 18px;border-radius:999px;font-size:14px;z-index:40;
       opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
       max-width:90%;text-align:center;line-height:1.4}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="root"><div class="center"><div class="spin"></div>読み込んでいます…<p class="note">初回は10秒ほどかかることがあります</p></div></div>
<input type="file" id="cam" accept="image/*" capture="environment" class="hide" onchange="onShot(event)">
<input type="file" id="lib" accept="image/*" multiple class="hide" onchange="onLib(event)">

<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="bar" id="sheetBar"></div>
  <div class="body" id="sheetBody"></div>
  <div class="foot2" id="sheetFoot"></div>
</div>

<script>
/* ========================================================= */
var LIFF_ID     = '2011524519-lSwDjFOP';
var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwYguEyJP2VaZ3xixjiCUIHy2a_qAW_umaaQ4UAGgsT9N0jLo7gajy-y2s4qV7d0zBz/exec';
var MAX_PHOTOS  = 10;
/* ========================================================= */

var S = {
  idToken:'', emp:null, cfg:null,
  period:'', periodLabel:'', dates:[], today:'',
  items:[], routes:[], defClinic:'',
  view:'',                 // 表示中の期間
  cache:{},                // 期間 → 明細
  day:'', draft:null,
  queue:[], reqId:'',      // 撮影して確認待ちの明細と、その送信キー
  shots:[],                // 撮影済みでまだ読み取っていない画像
  dragging:false, dirty:false, keepScroll:false
};

/* ---------- アイコン（iOS風の線画・自前SVG） ---------- */
var IC = {
  camera:'<path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-1.7a1 1 0 0 1 .9-.5h5.8a1 1 0 0 1 .9.5l1 1.7h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/><circle cx="12" cy="12.5" r="3.4"/>',
  car:'<path d="M5 16.5h14M6.2 12l1.3-3.7A2 2 0 0 1 9.4 7h5.2a2 2 0 0 1 1.9 1.3L17.8 12"/><rect x="3.5" y="12" width="17" height="4.5" rx="1.6"/><path d="M6.5 16.5v1.8M17.5 16.5v1.8"/>',
  road:'<path d="M8.5 4 6 20M15.5 4 18 20M12 5v2.5M12 11v2.5M12 17v2.5"/>',
  park:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M10 16V8.5h2.6a2.4 2.4 0 0 1 0 4.8H10"/>',
  doc:'<path d="M6.5 3.5h7l4.5 4.5v12a1 1 0 0 1-1 1h-10.5a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1z"/><path d="M13.5 3.5V8h4.5M9 13h6M9 16.5h4"/>',
  pencil:'<path d="M4 20h4l10-10a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 6.5 17.5 9.5"/>',
  check:'<path d="M5 12.5 10 17.5 19 7"/>',
  square:'<rect x="4" y="4" width="16" height="16" rx="4.5"/>',
  checkbox:'<rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M8.3 12.2 11 14.9 15.8 9.4"/>',
  left:'<path d="M14.5 5 8 12l6.5 7"/>',
  right:'<path d="M9.5 5 16 12l-6.5 7"/>',
  gear:'<circle cx="12" cy="12" r="2.9"/><path d="M19.1 13.6a7.6 7.6 0 0 0 0-3.2l1.8-1.3-1.8-3.1-2.1.8a7.6 7.6 0 0 0-2.8-1.6L13.9 3h-3.8l-.3 2.2a7.6 7.6 0 0 0-2.8 1.6l-2.1-.8-1.8 3.1 1.8 1.3a7.6 7.6 0 0 0 0 3.2l-1.8 1.3 1.8 3.1 2.1-.8a7.6 7.6 0 0 0 2.8 1.6l.3 2.2h3.8l.3-2.2a7.6 7.6 0 0 0 2.8-1.6l2.1.8 1.8-3.1z"/>',
  close:'<path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/>',
  plus:'<path d="M12 5.5v13M5.5 12h13"/>',
  trash:'<path d="M4.5 6.5h15M9.5 6.5V4.8a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1.7M6.5 6.5l.9 12a1 1 0 0 0 1 .9h7.2a1 1 0 0 0 1-.9l.9-12"/>'
};
function ico(n, cls){ return '<svg class="i '+(cls||'')+'" viewBox="0 0 24 24">'+IC[n]+'</svg>'; }
function catIcon(c){
  return c==='ガソリン'?'car':c==='高速代'?'road':c==='駐車場代'?'park':'doc';
}

/* ---------- 小道具 ---------- */
function api(fn,args,ms,retry){
  var timeout = new Promise(function(_,rej){
    setTimeout(function(){ rej(new Error('サーバーの応答がありません（'+((ms||60000)/1000)+'秒）')); }, ms||60000);
  });
  var call = fetch(GAS_API_URL,{method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({fn:fn,args:args||{}})})
    .then(function(r){
      if(!r.ok) throw new Error('通信エラー HTTP '+r.status);
      return r.text();
    })
    .then(function(txt){
      var j;
      try { j = JSON.parse(txt); }
      catch(e){
        // GASがPOSTを転送する際、まれにGETとして届く。1度だけ送り直す。
        if(!retry) return api(fn,args,ms,true);
        throw new Error('応答を解釈できません：'+txt.slice(0,60));
      }
      if(j && j.getFallback){
        if(!retry) return api(fn,args,ms,true);
        throw new Error('リクエストが正しく届きませんでした。もう一度お試しください。');
      }
      return j;
    });
  return Promise.race([call, timeout]);
}

/**
 * 画像から短い識別子を作る。同じ写真かどうかを確実に見分けるために使う。
 * AIの読み取り結果は毎回わずかに揺れるため、金額や日付だけでは重複を判定できない。
 */
function imgHash(b64){
  var h1 = 5381, h2 = 52711, len = b64.length;
  for (var i = 0; i < len; i++) {
    var c = b64.charCodeAt(i);
    h1 = (h1 * 33 ^ c) >>> 0;
    h2 = (h2 * 31 ^ c) >>> 0;
  }
  return len.toString(36) + '-' + h1.toString(36) + h2.toString(36);
}

/** 送信ごとの一意キー。通信をやり直しても二重登録されないようにする */
function newReqId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function yen(n){ return Number(n||0).toLocaleString('ja-JP'); }
function md(iso){ var p=iso.split('-'); return Number(p[1])+'/'+Number(p[2]); }
function dow(iso){ var p=iso.split('-');
  return new Date(Date.UTC(Number(p[0]),Number(p[1])-1,Number(p[2]))).getUTCDay(); }
function wdName(iso){ return '日月火水木金土'[dow(iso)]; }
function itemsOf(d){ return S.items.filter(function(x){ return x.date===d; }); }
function sumOf(l){ var t=0; l.forEach(function(x){ t+=Number(x.amount)||0; }); return t; }
function shiftPeriod(p,n){
  var a=p.split('-'), y=Number(a[0]), m=Number(a[1])+n;
  while(m<1){ m+=12; y--; } while(m>12){ m-=12; y++; }
  return y+'-'+('0'+m).slice(-2);
}
function periodLabelOf(p){
  var a=p.split('-'), m=Number(a[1]), sm=m-1; if(sm<1) sm=12;
  return sm+'/'+(S.cfg.closingDay+1)+'〜'+m+'/'+S.cfg.closingDay;
}
function datesOf(p){
  var a=p.split('-'), y=Number(a[0]), m=Number(a[1]);
  var cd=S.cfg.closingDay, out=[];
  var cur=new Date(Date.UTC(y,m-2,cd+1)), end=new Date(Date.UTC(y,m-1,cd));
  while(cur<=end){
    out.push(cur.getUTCFullYear()+'-'+('0'+(cur.getUTCMonth()+1)).slice(-2)+'-'+('0'+cur.getUTCDate()).slice(-2));
    cur.setUTCDate(cur.getUTCDate()+1);
  }
  return out;
}

/* 1か月分のグリッドを組み立てる */
function gridHtml(p){
  var list = S.cache[p] || (p===S.view ? S.items : null);
  var h = '<div class="page" data-p="'+p+'"><div class="grid">';
  var ds = datesOf(p);
  for (var b=0;b<dow(ds[0]);b++) h += '<div class="cell blank"></div>';
  ds.forEach(function(d){
    var t = list ? sumOf(list.filter(function(x){return x.date===d;})) : 0;
    var cls='cell';
    if (dow(d)===0) cls+=' sun';
    if (dow(d)===6) cls+=' sat';
    if (d===S.today) cls+=' today';
    if (d > S.today) cls+=' future';
    h += '<button class="'+cls+'" data-d="'+d+'" onclick="openDay(\'' + d + '\')">'+
         '<span class="d">'+Number(d.split('-')[2])+'</span>'+
         (t?'<span class="amt">'+yen(t)+'</span>':'')+'</button>';
  });
  return h + '</div></div>';
}

/* 左右スワイプで期間を移動 */
/**
 * カレンダーの横スライド。
 * 3面（前・当・次）を並べた帯を指に完全に追従させ、離したら近い面に吸い付ける。
 * 途中で触れば即座にその場で掴み直せる（ダイヤルを回すような手触りにする）。
 */
function bindSwipe(){
  var stage = document.getElementById('stage');
  var track = document.getElementById('track');
  if(!stage || !track) return;

  var w = stage.clientWidth;
  var base = -w;          // いま表示している面の位置
  var cur  = base;        // 帯の現在位置
  var startX = 0, startY = 0, startPos = 0;
  var lastX = 0, lastT = 0, vx = 0;
  var dragging = false, decided = false, horiz = false;
  var raf = 0, target = 0, animating = false;

  function place(px){
    cur = px;
    track.style.transform = 'translate3d(' + px + 'px,0,0)';
  }
  place(base);

  // 慣性で目標位置へ吸い付ける（毎フレーム少しずつ近づける）
  function glide(){
    animating = true;
    var diff = target - cur;
    if (Math.abs(diff) < 0.5){
      place(target); animating = false; raf = 0;
      settle();
      return;
    }
    place(cur + diff * 0.22);
    raf = requestAnimationFrame(glide);
  }

  // 面が入れ替わったら中身を差し替えて位置を戻す
  function settle(){
    var moved = Math.round((base - target) / w);   // -1:前へ  1:次へ
    if (!moved){ S.dragging = false; if(S.dirty){ S.dirty=false; paintAmounts(); } return; }
    S.dragging = false; S.dirty = false;
    goPeriod(moved > 0 ? 1 : -1);                  // 再描画され、この関数は貼り直される
  }

  function stopGlide(){
    if (raf){ cancelAnimationFrame(raf); raf = 0; }
    animating = false;
  }

  stage.addEventListener('touchstart', function(e){
    if (e.touches.length !== 1) return;
    w = stage.clientWidth; base = -w;
    stopGlide();                       // 動いている途中でも、その位置から掴み直す
    startX = lastX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startPos = cur; lastT = Date.now(); vx = 0;
    dragging = true; decided = false; horiz = false;
  }, {passive:true});

  stage.addEventListener('touchmove', function(e){
    if (!dragging) return;
    var x = e.touches[0].clientX, y = e.touches[0].clientY;
    var dx = x - startX, dy = y - startY;

    if (!decided){
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      decided = true;
      horiz = Math.abs(dx) > Math.abs(dy);
      if (!horiz){ dragging = false; return; }     // 縦スクロールに譲る
      S.dragging = true;
    }
    if (e.cancelable) e.preventDefault();

    var now = Date.now(), dt = now - lastT;
    if (dt > 0){ vx = (x - lastX) / dt; lastX = x; lastT = now; }   // 指の速さを覚えておく

    var pos = startPos + dx;
    // 未来側へは進めないので、引っ張っても戻る手応えにする
    if (pos < base && shiftPeriod(S.view, 1) > S.period) pos = base + (pos - base) * 0.25;
    place(pos);
  }, {passive:false});

  function release(){
    if (!dragging) return;
    dragging = false;
    if (!horiz){ S.dragging = false; return; }

    var moved = cur - base;
    // 指を速く払ったときは、距離が短くても次の面へ送る
    var flick = Math.abs(vx) > 0.35 ? (vx > 0 ? 1 : -1) : 0;
    var dir = 0;
    if (flick) dir = flick;
    else if (Math.abs(moved) > w * 0.32) dir = moved > 0 ? 1 : -1;

    if (dir < 0 && shiftPeriod(S.view, 1) > S.period) dir = 0;      // 未来へは行かない
    target = base + dir * w;
    glide();
  }
  stage.addEventListener('touchend', release, {passive:true});
  stage.addEventListener('touchcancel', function(){
    if (!dragging) return;
    dragging = false; S.dragging = false;
    target = base; glide();
  }, {passive:true});
}

function goPeriod(n){
  var next = shiftPeriod(S.view, n);
  if (next > S.period) return;                 // 未来の期間は見せない
  S.view = next;
  S.items = S.cache[next] || [];
  renderCal();                                  // 通信を待たずに即描画
  prefetch(next);                               // 足りないデータは後から差し込む
  prefetch(shiftPeriod(next,-1));
  prefetch(shiftPeriod(next,1));
}
/* 隣の期間を先読みしておく（スワイプ時に金額が空にならないように） */
function prefetch(p){
  if (p > S.period || S.cache[p]) return;
  api('apiGetMyList',{idToken:S.idToken, period:p}).then(function(r){
    if(!r.ok) return;
    S.cache[p]=r.items||[];
    if(p===S.view) S.items=S.cache[p];      // 表示中の期間なら中身も入れ替える
    // 指で操作している最中は絶対に描き直さない（カクつきの原因になるため）
    if(S.dragging) { S.dirty=true; return; }
    paintAmounts();
  });
}

/**
 * 金額だけを後から差し込む。DOM全体を作り直さないので描画が軽い。
 */
function paintAmounts(){
  var track=document.getElementById('track'); if(!track) return;
  var pages=track.querySelectorAll('.page');
  for(var i=0;i<pages.length;i++){
    var p=pages[i].getAttribute('data-p'), list=S.cache[p];
    if(!list) continue;
    var byDay={};
    list.forEach(function(x){ byDay[x.date]=(byDay[x.date]||0)+(Number(x.amount)||0); });
    var cells=pages[i].querySelectorAll('.cell[data-d]');
    for(var j=0;j<cells.length;j++){
      var d=cells[j].getAttribute('data-d'), t=byDay[d]||0;
      var el=cells[j].querySelector('.amt');
      if(t){ if(!el){ el=document.createElement('span'); el.className='amt'; cells[j].appendChild(el); }
             el.textContent=yen(t); }
      else if(el){ el.remove(); }
    }
  }
  var cur=S.cache[S.view]||[];
  var tv=document.getElementById('totV'), tc=document.getElementById('totC');
  if(tv) tv.textContent=yen(sumOf(cur));
  if(tc) tc.textContent=cur.length+'件';
}
function loadPeriod(p){
  S.view = p;
  if (S.cache[p]) { S.items = S.cache[p]; return Promise.resolve(); }
  S.items = [];
  return api('apiGetMyList',{idToken:S.idToken, period:p}).then(function(r){
    if (r.ok){ S.items = r.items||[]; S.cache[p] = S.items; }
  });
}

/* 明細を左にスライドすると削除ボタンが出る */
function bindSwipeRows(){
  var rows = document.querySelectorAll('#sheetBody .swipe');
  var W = 76;                                  // 削除ボタンの幅
  Array.prototype.forEach.call(rows, function(row){
    var item = row.querySelector('.item');
    var x0=0, y0=0, dx=0, open=false, drag=false, decided=false;
    function set(px, anim){
      item.style.transition = anim ? 'transform .18s ease-out' : 'none';
      item.style.transform = 'translateX(' + px + 'px)';
    }
    row.addEventListener('touchstart', function(e){
      if(e.touches.length!==1) return;
      x0=e.touches[0].clientX; y0=e.touches[0].clientY;
      dx=0; drag=true; decided=false;
    },{passive:true});
    row.addEventListener('touchmove', function(e){
      if(!drag) return;
      var mx=e.touches[0].clientX-x0, my=e.touches[0].clientY-y0;
      if(!decided){
        if(Math.abs(mx)<6 && Math.abs(my)<6) return;
        decided=true;
        if(Math.abs(my)>Math.abs(mx)){ drag=false; return; }
      }
      if(e.cancelable) e.preventDefault();
      var base = open ? -W : 0;
      dx = Math.min(0, Math.max(-W-20, base+mx));
      set(dx,false);
    },{passive:false});
    row.addEventListener('touchend', function(){
      if(!drag) return; drag=false;
      open = dx < -W/2;
      set(open ? -W : 0, true);
      // 他の行は閉じる
      Array.prototype.forEach.call(rows, function(o){
        if(o!==row){ var i2=o.querySelector('.item');
          i2.style.transition='transform .18s'; i2.style.transform='translateX(0)'; }
      });
    },{passive:true});
  });
}

function askDelete(id){

  // 先に画面から消して、通信は裏で待つ（体感を速くする）
  var backup = S.items.slice();
  S.items = S.items.filter(function(i){ return i.id!==id; });
  S.cache[S.period]=S.items;
  renderCal(); showDay(); toast('削除しました');

  api('apiDelete',{idToken:S.idToken,id:id}).then(function(r){
    if(!r.ok){
      S.items=backup; S.cache[S.period]=S.items;
      renderCal(); showDay(); alert('削除できませんでした：'+r.error);
    }
  }).catch(function(){
    S.items=backup; S.cache[S.period]=S.items;
    renderCal(); showDay(); alert('通信に失敗しました。削除は取り消されました。');
  });
}

/** 溜めた写真をまとめてAIに送る（1回の通信で全枚数を処理する） */
function readShots(){
  var shots=S.shots.slice(); if(!shots.length) return;
  S.queue=[];
  setSheet('<h3>読み取り中</h3>'+closeBtn(),
    '<div class="center"><div class="spin"></div>'+shots.length+'枚を読み取っています…'+
    '<p class="note">20〜40秒ほどかかります</p></div>');

  api('apiReadReceipts',{idToken:S.idToken, images:shots}, 180000).then(function(r){
    var res = (r && r.ok && r.results) ? r.results : [];
    shots.forEach(function(b64, i){
      var rc = (res[i] && res[i].length) ? res[i] : [null];
      rc.forEach(function(a){
        S.queue.push({
          date:(a&&a.date&&a.date<=S.today)?a.date:(S.day||S.today),
          clinic:S.defClinic||(S.emp.clinic||''),
          category:(a&&a.kind)?a.kind:'その他',
          amount:(a&&a.amount)?a.amount:'',
          aiAmount:(a&&a.amount)?a.amount:'',
          memo:(a&&a.store)?a.store:'',
          image:b64, hash:imgHash(b64), km:'', from:'', to:'', trip:'', ok:false,
          conf:(a && a.confidence) ? a.confidence : 'low',
          err:(!a && r && r.note)?r.note:''
        });
      });
    });
    S.shots=[]; showQueue();
  }).catch(function(e){
    S.shots=shots;
    setSheet('<h3>読み取りに失敗</h3>'+closeBtn(),
      '<div class="alert">'+esc(e&&e.message?e.message:e)+'</div>'+
      '', '<button class="btn save" onclick="readShots()"><span>もう一度読み取る</span></button>'+
      '<button class="btn del" onclick="showShots()"><span>写真の画面に戻る</span></button>');
  });
}

/** 店名を突き合わせやすい形に整える（記号や空白の違いを吸収する） */
function normStore(s){
  return String(s||'').replace(/[\s　]/g,'')
    .replace(/[（）()株式会社有限会社店支店営業所]/g,'').toLowerCase().slice(0,8);
}

/**
 * 重複の候補を見つける。
 * ・同じ写真 → 確実な重複として登録を止める
 * ・同じ日・同じ種類で「金額がほぼ同じ」または「店名が一致」→ 警告のみ（本人が判断）
 * AIの読み取りは毎回わずかに揺れるため、金額の完全一致だけでは取りこぼす。
 */
function markDuplicates(){
  var seenImg = {}, past = [];
  S.items.forEach(function(x){
    if (x.hash) seenImg[x.hash] = true;
    past.push({ date:x.date, category:x.category, amount:Number(x.amount)||0,
                store:normStore(x.memo), where:'登録済み' });
  });

  S.queue.forEach(function(q){
    q.dup = ''; q.dupHard = false;

    // 同じ写真は確実な重複
    if (q.hash && seenImg[q.hash]) {
      q.dup = '同じ写真が既に登録されています'; q.dupHard = true;
      if (q.ok) q.ok = false;
      return;
    }

    var amt = parseInt(q.amount,10);
    if (!(amt > 0)) return;
    var st = normStore(q.memo);

    for (var i = 0; i < past.length; i++) {
      var x = past[i];
      if (x.date !== q.date || x.category !== q.category) continue;
      var near = Math.abs(x.amount - amt) <= 2;
      var same = st && x.store && st === x.store;
      if (near || same) {
        q.dup = (x.where === '登録済み' ? '同じ日に似た内容が登録済み' : 'この中に似た内容があります') +
                '（' + yen(x.amount) + '円' + (x.store ? '・' + x.store : '') + '）';
        break;
      }
    }
    // 自分自身も以降の突き合わせ対象に加える
    past.push({ date:q.date, category:q.category, amount:amt, store:st, where:'この中' });
  });
}

function showQueue(){
  markDuplicates();
  var okCount = 0, canCount = 0;
  S.queue.forEach(function(q){
    if (q.ok) okCount++;
    if (parseInt(q.amount,10) > 0 && !q.dupHard) canCount++;
  });

  var bar = '<h3>内容の確認</h3><span class="rt">'+S.queue.length+'件</span>'+closeBtn();
  var b = '';

  S.queue.forEach(function(q,idx){
    var need  = !(parseInt(q.amount,10) > 0);
    var unsure = !need && q.conf === 'low';       // 数字は出たが自信がない
    var block = need || q.dupHard;                // 登録を止めるのは確実な重複だけ
    b += '<div class="card '+(q.ok?'done':'')+(q.dup?' dup':'')+'">'+
         '<div class="top">'+
           (q.image?'<img class="thumb" src="data:image/jpeg;base64,'+q.image+'">':'<div class="thumb noimg">'+ico('doc')+'</div>')+
           '<div class="tx">'+
             '<div class="cat">'+esc(q.category)+'</div>'+
             '<div class="sub">'+md(q.date)+'（'+wdName(q.date)+'）　'+esc(q.clinic)+'</div>'+
           '</div>'+
           '<div class="amt2'+(unsure?' unsure':'')+'">'+(need?'—':yen(q.amount))+
             '<span class="cur">円</span>'+(unsure?'<span class="q">?</span>':'')+'</div>'+
         '</div>'+
         (q.err ? '<div class="alert">'+esc(q.err)+'</div>' : '')+
         (q.dup ? '<div class="alert'+(q.dupHard?'':' warn')+'">'+esc(q.dup)+
                  (q.dupHard ? '。登録しません。' : '。内容をご確認ください。')+'</div>' : '')+
         (need && !q.err ? '<div class="alert">金額を読み取れませんでした。「直す」から入力してください。</div>' : '')+
         (unsure ? '<div class="alert warn">金額に自信がありません。レシートと見比べてください。</div>' : '')+
         '<div class="row2">'+
           '<button class="btn ok" onclick="toggleOk('+idx+')" '+(block?'disabled':'')+'>'+
             ico(q.ok?'checkbox':'square')+'<span>'+(q.ok?'確認済み':'OK')+'</span></button>'+
           '<button class="btn fix" onclick="fixQueue('+idx+')"><span>直す</span></button>'+
           '<button class="btn fix del2" onclick="dropQueue('+idx+')">'+ico('trash')+'</button>'+
         '</div></div>';
  });

  var foot = '';
  if (canCount > 1) {
    var allOn = (okCount === canCount);
    foot += '<button class="btn selall'+(allOn?' on':'')+'" onclick="toggleAll()">'+
            ico(allOn?'checkbox':'square')+'<span>'+(allOn?'すべて解除':'すべて選ぶ')+'</span></button>';
  }
  foot += '<button class="btn save" id="batchBtn" onclick="saveQueue()" '+
          (okCount?'':'disabled')+'><span>'+(okCount? okCount+'件を保存する' : '保存する')+'</span></button>'+
          '<button class="btn del" onclick="closeSheet()"><span>やめる</span></button>';

  setSheet(bar, b, foot, S.keepScroll);
  S.keepScroll = false;
}
function toggleOk(i){ S.keepScroll=true; S.queue[i].ok = !S.queue[i].ok; showQueue(); }
function toggleAll(){
  var can = S.queue.filter(function(q){ return parseInt(q.amount,10)>0 && !q.dupHard; });
  var allOn = can.length && can.every(function(q){ return q.ok; });
  can.forEach(function(q){ q.ok = !allOn; });
  S.keepScroll = true; showQueue();
}
function dropQueue(i){ S.queue.splice(i,1); if(!S.queue.length){ closeSheet(); return; }
  S.keepScroll=true; showQueue(); }
function fixQueue(i){
  S.draft = JSON.parse(JSON.stringify(S.queue[i]));
  S.draft.qi = i; S.draft.id='';
  showForm('');
}
function saveQueue(){
  var list = S.queue.filter(function(q){ return q.ok; });
  if(!list.length) return;
  var btn=document.getElementById('batchBtn');
  btn.disabled=true; btn.textContent='保存しています…';
  if(!S.reqId) S.reqId = newReqId();
  var imgs = list.map(function(q){ return q.image || ''; });
  api('apiSubmitBatch',{idToken:S.idToken, reqId:S.reqId, items:list.map(function(q){
    return { date:q.date, clinic:q.clinic, category:q.category, amount:q.amount,
             km:q.km, from:q.from, to:q.to, trip:q.trip, memo:q.memo,
             hash:q.hash||'', aiAmount:q.aiAmount };
  })}).then(function(r){
    if(!r.ok){ btn.disabled=false; btn.textContent='保存する'; alert(r.error); return; }
    S.reqId=''; S.queue=[]; S.items=r.items||S.items; S.cache[S.period]=S.items;
    S.view=S.period; renderCal(); closeSheet();
    toast(r.saved + '件を登録しました' + (r.skipped ? '（重複など' + r.skipped + '件は除外）' : ''));
    // 画像は登録が終わってから裏で貼り付ける（保存を待たせない）
    if (r.ids && r.ids.length) {
      api('apiAttachImages',{idToken:S.idToken, ids:r.ids, images:imgs.slice(0, r.ids.length)}, 180000)
        .catch(function(){});
    }
  }).catch(function(){ btn.disabled=false; btn.textContent='保存する';
    alert('通信に失敗しました。'); });
}

/* --- 画像変換 --- */
function toJpegBase64(file){
  return shrink(file,1400,0.75).catch(function(){ return rawBase64(file); })
    .then(function(b64){ if(b64.length>4000000) throw new Error('画像サイズが大きすぎます'); return b64; });
}
function shrink(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image(), done=false;
    var t=setTimeout(function(){ if(!done){done=true;URL.revokeObjectURL(url);rej(new Error('タイムアウト'));} },12000);
    img.onload=function(){
      if(done)return; done=true; clearTimeout(t);
      try{
        var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        var s=Math.min(1,max/Math.max(w,h));
        var cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(w*s)); cv.height=Math.max(1,Math.round(h*s));
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        var out=cv.toDataURL('image/jpeg',q).split(',')[1];
        URL.revokeObjectURL(url);
        if(!out||out.length<100) rej(new Error('変換に失敗')); else res(out);
      }catch(err){ URL.revokeObjectURL(url); rej(err); }
    };
    img.onerror=function(){ if(done)return; done=true; clearTimeout(t);
      URL.revokeObjectURL(url); rej(new Error('画像を開けません')); };
    img.src=url;
  });
}
function rawBase64(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ var s=String(fr.result),i=s.indexOf(',');
      i>=0?res(s.slice(i+1)):rej(new Error('読み込み失敗')); };
    fr.onerror=function(){ rej(new Error('読み込み失敗')); };
    fr.readAsDataURL(file);
  });
}

/* =========================================================
   単票フォーム
   ========================================================= */
function startGas(){ newDraft({category:'ガソリン',trip:'業務'}); showGasPick(); }
function startManual(){ newDraft({category:'その他'}); showForm(''); }
function newDraft(o){
  S.draft={ id:'', qi:-1, date:S.day||S.today, clinic:S.defClinic||(S.emp.clinic||''),
    category:o.category||'', amount:o.amount||'', km:'', from:'', to:'',
    trip:o.trip||'', memo:'', image:'', aiAmount:'' };
}

/* よく使うルートから選ぶ */
function showGasPick(){
  if(!S.routes.length){ showForm(''); return; }
  var bar=backBtn('chooseType()')+'<h3>よく使うルート</h3>'+closeBtn();
  var b='';
  S.routes.forEach(function(r,i){
    b+='<button class="rchip" onclick="useRoute('+i+')">'+esc(r.from)+' → '+esc(r.to)+
       '<span>　'+esc(r.km)+'km・'+yen(Math.round(Number(r.km)*S.cfg.gasRate))+'円</span></button>';
  });
  setSheet(bar,b,'<button class="btn add" style="margin-top:0" onclick="showForm(\'\')">'+
    ico('plus')+'<span>新しい経路を入力</span></button>');
}
function useRoute(i){
  var r=S.routes[i];
  S.draft.from=r.from; S.draft.to=r.to; S.draft.km=r.km; S.draft.trip=r.trip||'業務';
  showForm('');
}

function showForm(hint){
  var d=S.draft, isGas=d.category==='ガソリン', edit=!!d.id, fromQ=(d.qi>=0);
  var bar=backBtn(edit?'showDay()':(fromQ?'showQueue()':'chooseType()'))+
          '<h3>'+md(d.date)+'（'+wdName(d.date)+'）</h3>'+closeBtn();
  var b='';
  if(hint) b+='<div class="msg">'+esc(hint)+'</div>';
  if(d.image) b+='<img class="prev" src="data:image/jpeg;base64,'+d.image+'">';

  b+='<label class="fl">日付</label><input type="date" id="fDate" value="'+esc(d.date)+'" max="'+S.today+'">';

  b+='<label class="fl">種類</label><div class="chips">';
  var cats=S.cfg.categories.slice();
  if(cats.indexOf('ガソリン')<0) cats.unshift('ガソリン');
  cats.forEach(function(c){
    b+='<button class="chip '+(d.category===c?'on':'')+'" onclick="setCat(\'' + c + '\')">'+esc(c)+'</button>';
  });
  b+='</div>';

  b+='<label class="fl">所属院</label><select id="fClinic">';
  S.cfg.clinics.forEach(function(c){
    b+='<option value="'+esc(c)+'" '+(d.clinic===c?'selected':'')+'>'+esc(c)+'</option>'; });
  b+='</select>';

  if(isGas){
    b+='<label class="fl">移動区分</label><div class="chips">'+
       '<button class="chip '+(d.trip==='業務'?'on':'')+'" onclick="setTrip(\'業務\')">業務</button>'+
       '<button class="chip '+(d.trip==='通勤'?'on':'')+'" onclick="setTrip(\'通勤\')">通勤</button></div>'+
       '<label class="fl">出発地 → 到着地</label><div style="display:flex;gap:8px">'+
       '<input type="text" id="fFrom" value="'+esc(d.from)+'" placeholder="自宅">'+
       '<input type="text" id="fTo" value="'+esc(d.to)+'" placeholder="東生駒院"></div>'+
       '<label class="fl">走行距離（km）</label>'+
       '<input type="number" id="fKm" inputmode="decimal" step="0.1" min="0" value="'+esc(d.km)+'" oninput="calcGas()">'+
       '<div class="calc">金額 <b id="gasAmt">—</b> 円<span class="note" style="margin-left:8px">1kmあたり '+S.cfg.gasRate+'円</span></div>';
  } else {
    b+='<label class="fl">金額（税込・円）</label>'+
       '<input type="number" id="fAmt" inputmode="numeric" min="1" value="'+esc(d.amount)+'" placeholder="1204">';
  }

  b+='<label class="fl">メモ（任意）</label>'+
     '<input type="text" id="fMemo" value="'+esc(d.memo)+'" placeholder="店名・内容など">';
  b+='<div class="msg err" id="fMsg" aria-live="polite"></div>';
  b+='<div id="dupBox"></div>';

  var foot='<button class="btn save" id="saveBtn" onclick="saveDraft(false)"><span>'+
     (fromQ?'この内容にする':(edit?'この内容に修正する':'保存する'))+'</span></button>';
  if(edit) foot+='<button class="btn del" onclick="delItem()">'+ico('trash')+'<span>削除する</span></button>';
  setSheet(bar,b,foot);
  if(isGas) calcGas();
}
function pullForm(){
  var d=S.draft, g=function(id){ var e=document.getElementById(id); return e?e.value:''; };
  d.date   = g('fDate')||d.date;
  d.clinic = g('fClinic')||d.clinic;
  d.memo   = g('fMemo');
  if(d.category==='ガソリン'){ d.km=g('fKm'); d.from=g('fFrom'); d.to=g('fTo'); d.amount=''; }
  else { d.amount=g('fAmt'); d.km=''; }
}
function setCat(c){ pullForm(); S.draft.category=c; showForm(''); }
function setTrip(t){ pullForm(); S.draft.trip=t; showForm(''); }
function calcGas(){
  var v=parseFloat(document.getElementById('fKm').value), ok=v>0&&v<=2000;
  document.getElementById('gasAmt').textContent = ok?yen(Math.round(v*S.cfg.gasRate)):'—';
}

function saveDraft(confirmed){
  pullForm();
  var d=S.draft, m=document.getElementById('fMsg'), btn=document.getElementById('saveBtn');
  m.textContent='';
  if(!d.category){ m.textContent='種類を選んでください。'; return; }
  if(d.category==='ガソリン'){
    if(!(parseFloat(d.km)>0)){ m.textContent='走行距離を入力してください。'; return; }
    if(!d.from||!d.to){ m.textContent='出発地と到着地を入力してください。'; return; }
    if(!d.trip){ m.textContent='移動区分を選んでください。'; return; }
  } else if(!(parseInt(d.amount,10)>0)){ m.textContent='金額を入力してください。'; return; }

  // 撮影キューの1件を直しただけなら、保存せずキューに戻す
  if(d.qi>=0){
    var q=S.queue[d.qi];
    ['date','clinic','category','amount','km','from','to','trip','memo'].forEach(function(k){ q[k]=d[k]; });
    q.ok=true; S.draft=null; showQueue(); return;
  }

  btn.disabled=true; btn.textContent='保存しています…';
  var payload={ date:d.date, clinic:d.clinic, category:d.category, amount:d.amount,
    km:d.km, from:d.from, to:d.to, trip:d.trip, memo:d.memo,
    imageBase64:d.image, aiAmount:d.aiAmount, confirmed:!!confirmed };
  if(!d.reqId) d.reqId = newReqId();
  var call = d.id ? api('apiUpdate',{idToken:S.idToken,id:d.id,payload:payload})
                  : api('apiSubmit',{idToken:S.idToken,reqId:d.reqId,payload:payload});
  call.then(function(r){
    if(r.ok){
      if(r.items){ S.items=r.items; }
      else if(d.id){
        // 修正：手元の1件だけ書き換える（全件の再取得をしない）
        S.items=S.items.map(function(x){
          if(x.id!==d.id) return x;
          return { id:x.id, date:d.date, clinic:d.clinic, category:d.category,
                   amount:(r.amount!==undefined?r.amount:d.amount), km:d.km,
                   from:d.from, to:d.to, trip:d.trip, memo:d.memo, image:x.image };
        });
      } else {
        // 新規：返ってきた分を手元に足す
        S.items=S.items.concat([{ id:r.id||('tmp'+Date.now()), date:d.date, clinic:d.clinic,
          category:d.category, amount:(r.amount!==undefined?r.amount:d.amount),
          km:d.km, from:d.from, to:d.to, trip:d.trip, memo:d.memo, image:'' }]);
      }
      S.cache[S.period]=S.items;
      afterSave();
      return;
    }
    btn.disabled=false; btn.textContent=d.id?'この内容に修正する':'保存する';
    m.textContent=r.error;
    if(r.duplicate) document.getElementById('dupBox').innerHTML=
      '<button class="btn del" onclick="saveDraft(true)"><span>それでも登録する</span></button>';
  }).catch(function(){
    btn.disabled=false; btn.textContent=d.id?'この内容に修正する':'保存する';
    m.textContent='通信に失敗しました。もう一度お試しください。';
  });
}
function afterSave(){ S.day=S.draft?S.draft.date:S.day; S.draft=null; renderCal(); showDay(); toast('保存しました'); }

function editItem(id){
  var x=null; S.items.forEach(function(i){ if(i.id===id) x=i; });
  if(!x) return;
  S.draft={ id:x.id, qi:-1, date:x.date, clinic:x.clinic, category:x.category,
    amount:x.amount, km:x.km, from:x.from, to:x.to, trip:x.trip,
    memo:x.memo, image:'', aiAmount:'' };
  showForm('');
}
function delItem(){
  if(!confirm('この経費を削除しますか？')) return;
  var id=S.draft.id;
  S.items=S.items.filter(function(i){ return i.id!==id; });
  S.cache[S.period]=S.items; afterSave();
  api('apiDelete',{idToken:S.idToken,id:id}).then(function(r){
    if(!r.ok) alert('削除できませんでした：'+r.error);
  }).catch(function(){ alert('通信に失敗しました。'); });
}
function reload(){
  return api('apiGetMyList',{idToken:S.idToken,period:S.period}).then(function(r){
    if(r.ok){ S.items=r.items||[]; S.cache[S.period]=S.items; }
  });
}

/* =========================================================
   設定
   ========================================================= */
function openSettings(){
  var bar='<h3>設定</h3>'+closeBtn();
  var b='<label class="fl">自分の所属院（次回から初期値になります）</label><select id="sClinic">';
  S.cfg.clinics.forEach(function(c){
    b+='<option value="'+esc(c)+'" '+(S.defClinic===c?'selected':'')+'>'+esc(c)+'</option>'; });
  b+='</select><div class="msg ok" id="sMsg" aria-live="polite"></div>'+
     '<p class="note">氏名：'+esc(S.emp.name)+'　従業員ID：'+esc(S.emp.id)+'</p>';
  setSheet(bar,b,'<button class="btn save" onclick="saveSettings()"><span>保存する</span></button>');
  openSheet();
}
function saveSettings(){
  var c=document.getElementById('sClinic').value;
  api('apiSetDefault',{idToken:S.idToken,clinic:c}).then(function(r){
    var m=document.getElementById('sMsg');
    if(!r.ok){ m.className='msg err'; m.textContent=r.error; return; }
    S.defClinic=c; m.className='msg ok'; m.textContent='保存しました。';
  });
}

/* =========================================================
   初回連携・起動
   ========================================================= */
function renderLink(){
  document.getElementById('root').innerHTML=
    '<div class="hd"><div class="ttl"><b>はじめに</b></div></div>'+
    '<div class="cal" style="padding:18px">'+
    '<p style="color:var(--sub);font-size:15px">最初の1回だけ、ご自身の従業員IDを入力してください。</p>'+
    '<label class="fl">従業員ID</label>'+
    '<input type="text" id="empId" inputmode="numeric" placeholder="例：100001">'+
    '<div class="msg err" id="linkMsg" aria-live="polite"></div>'+
    '<button class="save" onclick="doLink()">確認する</button></div>';
}
function doLink(){
  var v=document.getElementById('empId').value.trim(), m=document.getElementById('linkMsg');
  if(!v){ m.textContent='従業員IDを入力してください。'; return; }
  m.className='msg'; m.textContent='確認しています…';
  api('apiLink',{idToken:S.idToken,employeeId:v}).then(function(r){
    if(!r.ok){ m.className='msg err'; m.textContent=r.error; return; }
    S.emp=r.employee; S.defClinic=r.employee.clinic||'';
    reload().then(renderCal);
  }).catch(function(){ m.className='msg err'; m.textContent='通信に失敗しました。'; });
}

function boot(){
  liff.init({liffId:LIFF_ID}).then(function(){
    if(!liff.isLoggedIn()){ liff.login(); return; }
    S.idToken=liff.getIDToken();
    return api('apiGetProfile',{idToken:S.idToken});
  }).then(function(r){
    if(!r) return;
    if(!r.ok){ fail(r.error||'読み込みに失敗しました。'); return; }
    S.cfg=r.config; S.period=r.period; S.view=r.period; S.periodLabel=r.periodLabel;
    S.dates=r.dates; S.today=r.today; S.items=r.items||[];
    S.routes=r.routes||[]; S.defClinic=r.defaultClinic||'';
    S.cache[S.period]=S.items;
    if(r.linked){ S.emp=r.employee; renderCal(); } else renderLink();
  }).catch(function(e){
    fail('起動に失敗しました。\n' + (e && e.message ? e.message : e));
  });
}
function fail(msg){
  document.getElementById('root').innerHTML=
    '<div class="center"><p class="msg err" style="white-space:pre-wrap">'+esc(msg)+'</p>'+
    '<button class="save" style="max-width:220px;margin:14px auto 0" onclick="retryBoot()">もう一度読み込む</button>'+
    '<p class="note">解決しない場合は、LINEアプリを一度終了してから開き直してください。</p></div>';
}
function retryBoot(){
  document.getElementById('root').innerHTML=
    '<div class="center"><div class="spin"></div>読み込んでいます…</div>';
  boot();
}
boot();
</script>
